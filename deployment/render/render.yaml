# Render Deployment Configuration for GLM Platform
# ===================================================
# 100% FREE AI Platform - Uses Z.ai SDK (No OpenAI!)
# ===================================================

services:
  # Main Web Service
  - type: web
    name: glm-platform
    env: node
    runtime: node20
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    
    # Environment Variables - Only these are needed!
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NPM_FLAGS
        value: "--legacy-peer-deps"
    
    # Auto-deploy from GitHub
    autoDeploy: true
    
    # Free tier settings
    numInstances: 1

# ============================================================
# ENVIRONMENT VARIABLES FOR RENDER DASHBOARD:
# ============================================================
# 
# ✅ REQUIRED (Set these in Render Dashboard):
# -------------------------------------------
# NODE_ENV=production
# PORT=3000
#
# ⚙️ OPTIONAL:
# -------------------------------------------
# NEXTAUTH_SECRET=[generate with: openssl rand -base32 32]
# NEXTAUTH_URL=https://your-app.onrender.com
#
# 🆓 FREE AI SERVICES (No API Keys Needed!):
# -------------------------------------------
# ✅ Chat/LLM via Z.ai SDK (GLM-4)
# ✅ Image Generation via Z.ai SDK
# ✅ Web Search via Z.ai SDK
# ✅ Vision/Image Understanding via Z.ai SDK
# ✅ Text-to-Speech via Z.ai SDK
# ✅ Speech Recognition via Z.ai SDK
#
# ❌ NO OPENAI KEY NEEDED!
# ============================================================
