# Render Deployment Configuration
# ================================

services:
  # Main Web Service
  - type: web
    name: glm-platform
    env: node
    plan: standard
    buildCommand: bun run build
    startCommand: bun run start
    healthCheckPath: /api/health
    
    # Environment Variables (set in Render dashboard or use render.yaml)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    
    # Auto-deploy settings
    autoDeploy: true
    
    # Scaling
    numInstances: 1
    minInstances: 1
    maxInstances: 3
    
    # Resource limits
    disk:
      name: data-disk
      mountPath: /app/data
      sizeGB: 10

  # Background Training Worker (optional)
  - type: worker
    name: glm-training-worker
    env: python
    plan: standard+  # For GPU access if available
    buildCommand: pip install -r requirements.txt
    startCommand: python training/train.py --config config.yaml
    
    envVars:
      - key: CUDA_VISIBLE_DEVICES
        value: "0"
    
    # Only deploy when training files change
    autoDeploy: false

databases:
  # PostgreSQL for persistent storage (optional)
  - name: glm-database
    databaseName: glm_platform
    user: glm_user

# Cron jobs for maintenance
crons:
  - name: cleanup-old-exports
    schedule: "0 3 * * *"  # Daily at 3 AM UTC
    command: python scripts/cleanup_exports.py
    
  - name: generate-metrics-report
    schedule: "0 6 * * 1"  # Weekly on Monday at 6 AM UTC
    command: python scripts/generate_report.py
