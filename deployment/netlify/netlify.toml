# Netlify Configuration for GLM Platform
# This configures how Next.js app is deployed on Netlify

[build]
  # Build command - uses npm install with legacy peer deps for compatibility
  command = "npm install --legacy-peer-deps && npm run build"
  # Publish directory - where the built files are located
  publish = ".next"

# Plugins for Next.js support on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables (can be overridden in Netlify UI)
[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  # Leave NEXT_PUBLIC_API_URL empty to use local API routes (recommended)
  # Set to Render backend URL only if you want to use external backend
  # NEXT_PUBLIC_API_URL = "https://conversationalglm2.onrender.com"

# Headers for CORS and security
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Requested-With"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Redirect rules - ensure SPA routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# Handle static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
