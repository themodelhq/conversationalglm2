# Netlify Configuration for GLM Platform
# ======================================
# 100% FREE AI Platform - Uses Z.ai SDK (No OpenAI!)
# ======================================

[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# NETLIFY DEPLOYMENT SETTINGS:
# ============================================================
#
# Build Command: npm install --legacy-peer-deps && npm run build
# Publish Directory: .next
#
# ✅ REQUIRED Environment Variables:
# -------------------------------------------
# NODE_VERSION=20
# NPM_FLAGS=--legacy-peer-deps
#
# ⚙️ OPTIONAL:
# -------------------------------------------
# NEXTAUTH_SECRET=[generate with: openssl rand -base32 32]
# NEXT_PUBLIC_SITE_URL=https://your-site.netlify.app
#
# 🆓 FREE AI SERVICES (No API Keys Needed!):
# -------------------------------------------
# ✅ Chat/LLM via Z.ai SDK (GLM-4)
# ✅ Image Generation via Z.ai SDK
# ✅ Web Search via Z.ai SDK
# ✅ Vision/Image Understanding via Z.ai SDK
# ✅ Text-to-Speech via Z.ai SDK
# ✅ Speech Recognition via Z.ai SDK
#
# ❌ NO OPENAI KEY NEEDED!
# ============================================================
