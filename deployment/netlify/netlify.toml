# Netlify Configuration for GLM Platform
# ======================================
# 100% FREE AI Platform - Uses Z.ai SDK (No OpenAI!)
# ======================================

[build]
  command = "npm ci --legacy-peer-deps && npm run build"
  publish = ".next/standalone"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"
  # Disable Turbopack for reliable builds
  NEXT_BUILD_TURBO = "false"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/_next/static/*"
  to = "/_next/static/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
# ENVIRONMENT VARIABLES FOR NETLIFY DASHBOARD:
# Site Settings → Environment Variables
# ============================================================
#
# ✅ REQUIRED:
# -------------------------------------------
# NODE_VERSION=20
#
# ⚙️ OPTIONAL:
# -------------------------------------------
# NEXTAUTH_SECRET=[generate with: openssl rand -base32 32]
# NEXT_PUBLIC_SITE_URL=https://your-site.netlify.app
#
# 🆓 FREE AI SERVICES (No API Keys Needed!):
# -------------------------------------------
# ✅ Chat/LLM via Z.ai SDK (GLM-4)
# ✅ Image Generation via Z.ai SDK
# ✅ Web Search via Z.ai SDK
# ✅ Vision/Image Understanding via Z.ai SDK
# ✅ Text-to-Speech via Z.ai SDK
# ✅ Speech Recognition via Z.ai SDK
#
# ❌ NO OPENAI KEY NEEDED!
# ============================================================
